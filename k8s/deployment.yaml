apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp057-api
  labels:
    app: mp057-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mp057-api
  template:
    metadata:
      labels:
        app: mp057-api
    spec:
      containers:
        - name: api
          image: mp057-power-loom:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
